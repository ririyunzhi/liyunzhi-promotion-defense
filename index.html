function migrateAssetRevision(data) {
  if (data.meta.contentRevision === DEFAULT_DATA.meta.contentRevision) return data;
  const next = clone(data);

    project.galleryMode = fresh.galleryMode;
    const existing = project.gallery || [];
    project.gallery = [...existing, ...clone(fresh.gallery).filter(a => !existing.some(b => b.id === a.id))];
    if (!project.media) { project.media = fresh.media; project.mediaLabel = fresh.mediaLabel; }
    if (project.value === 'Coser：50+ 内容、曝光 286 万、上线约 $6,519；画师：30+ 内容、曝光 60 万、上线约 $50,960。') project.value = fresh.value;

  const freshReminder = DEFAULT_DATA.evidence.faster.find(a => a.id === 'lobster-reminders');
  const reminder = next.evidence.faster.find(a => a.id === 'lobster-reminders');
  if (!reminder) next.evidence.faster.push(clone(freshReminder));
  else if (reminder.src === './public/assets/evidence/lobster-reminders.png') Object.assign(reminder, clone(freshReminder));

  const freshAnn = DEFAULT_DATA.projects.find(p => p.id === 'anniversary');
  if (ann && freshAnn) { ann.value = freshAnn.value; ann.headlineMetric = clone(freshAnn.headlineMetric); ann.metrics = clone(freshAnn.metrics); ann.evidence = freshAnn.evidence; }

    if (jn.metrics && jn.metrics[0] && jn.metrics[0].value === '660 \u4e07') jn.metrics = clone(freshJn.metrics);
    if (jn.value && jn.value.includes('660 \u4e07') && !jn.value.includes('42,000')) jn.value = freshJn.value;
    if (jn.evidence && jn.evidence.includes('\u5e01\u79cd\u5f85\u786e\u8ba4')) jn.evidence = freshJn.evidence;

function render() {
  const oldEditor=document.querySelector('.editor-body');
  const editorScroll=oldEditor?.scrollTop || 0;
  const focused=document.activeElement;
  const focusAttrs=['data-month','data-field','data-edit-path','data-project-index','data-project-field'];
  const focusSelector=editorOpen && focused?.closest('.editor') ? focusAttrs.filter(k=>focused.hasAttribute(k)).map(k=>`[${k}="${CSS.escape(focused.getAttribute(k))}"]`).join('') : '';
  const selection=focused?.tagName==='TEXTAREA'?[focused.selectionStart,focused.selectionEnd]:null;
  activeIndex=Math.max(0,Math.min(activeIndex,visibleSlides().length-1));
  const app = document.querySelector('#app');
  app.innerHTML = `${renderSlide()}${renderChrome()}${editorHtml()}${qaHtml()}${sourceHtml()}${highlightHtml()}${noteModalHtml()}<div class="toast"></div>`;
  bindEvents();
  if(editorOpen){
    const next=focusSelector?document.querySelector(focusSelector):null;
    next?.focus({preventScroll:true});
    if(selection&&next?.setSelectionRange)next.setSelectionRange(...selection);
    const body=document.querySelector('.editor-body');if(body)body.scrollTop=editorScroll;
  }
  if (currentSlide()?.id === 'kpi' && !hasAnimatedKpi && !state.settings.reducedMotion && !matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(animateKpis, 100);
}
function animateKpis() { hasAnimatedKpi = true; document.querySelectorAll('[data-count]').forEach((el) => { const target = Number(el.dataset.count); const prefix = el.dataset.prefix || ''; const duration = 1000; const start = performance.now(); const frame = (now) => { const progress = Math.min(1,(now-start)/duration); const eased = 1 - Math.pow(1-progress,3); const current = target*eased; el.textContent = el.dataset.id === 'roi' ? current.toFixed(2) : `${prefix}${formatNumber(current)}`; if(progress<1) requestAnimationFrame(frame); }; requestAnimationFrame(frame); }); }
function bindEvents() {
 document.querySelectorAll('[data-action]').forEach(el=>{el.addEventListener('click',e=>handleAction(e,el));if(el.getAttribute('role')==='button')el.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();e.stopPropagation();el.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});});
 document.querySelectorAll('.svg-month').forEach(el=>{
  const show=()=>{const row=state.monthlyPerformance[Number(el.dataset.monthIndex)],tip=document.querySelector('.svg-tooltip');if(!tip)return;tip.innerHTML='<b>'+escapeHtml(row.month)+'</b><span>上线金额 <strong>$'+formatNumber(row.amount)+'</strong></span><span>上线成本 <strong>$'+formatNumber(row.cost)+'</strong></span><span>当月 ROI <strong>'+(monthRoi(row)===null?'—':formatNumber(monthRoi(row)))+'</strong></span>';tip.hidden=false;};
  const hide=()=>{const t=document.querySelector('.svg-tooltip');if(t)t.hidden=true;};el.addEventListener('mouseenter',show);el.addEventListener('focus',show);el.addEventListener('mouseleave',hide);el.addEventListener('blur',hide);
 });
 document.querySelectorAll('[data-edit-path]').forEach(el=>el.addEventListener('change',()=>{ const [group,key]=el.dataset.editPath.split('.'); update(d=>d[group][key]=el.value,'开场内容已保存'); }));
 document.querySelectorAll('[data-month]').forEach((el)=>{
  let inputTimer;
  const saveMonthly = () => {
    if(!el.isConnected)return;
    const i=Number(el.dataset.month), field=el.dataset.field;
    const raw=el.value.trim(),value=raw===''?null:Number(raw);
    if(value!==null&&(!Number.isFinite(value)||value<0)) {el.setCustomValidity('请输入不小于 0 的金额');el.reportValidity();return;}
    el.setCustomValidity('');
    if(state.monthlyPerformance[i][field]===value)return;
    update(d=>{d.monthlyPerformance[i][field]=value;d.monthlyPerformance[i].status='draft';},'月度数据已保存');
  };
  // Native number steppers and pasted values should update the dashboard immediately;
  // debounce typing so a multi-digit amount is not re-rendered character by character.
  el.addEventListener('input',()=>{ clearTimeout(inputTimer); inputTimer=setTimeout(saveMonthly,180); });
  el.addEventListener('change',()=>{ clearTimeout(inputTimer); saveMonthly(); });
 });
 document.querySelectorAll('[data-editor-visible]').forEach(el=>el.addEventListener('change',()=>{ const id=el.dataset.editorVisible; if(!el.checked&&visibleSlides().length===1){el.checked=true;toast('至少保留一页用于演示');return;} update(d=>d.slides.find(s=>s.id===id).visible=el.checked,'页面显示状态已保存'); activeIndex=Math.min(activeIndex,visibleSlides().length-1); }));
 document.querySelectorAll('[data-project-field]').forEach(el=>el.addEventListener('change',()=>{ const i=Number(el.dataset.projectIndex), field=el.dataset.projectField; update(d=>d.projects[i][field]=el.value,'项目卡已保存'); }));
 const importer = document.querySelector('[data-action="import"]'); if(importer) importer.addEventListener('change', importJson);
}
function handleAction(e, el) {
 const action = el.dataset.action;
 if(action==='next') go(1); if(action==='prev') go(-1); if(action==='jump') jump(el.dataset.slide); if(action==='toggle-menu') {menuOpen=!menuOpen; render();} if(action==='toggle-editor') {editorOpen=!editorOpen; render();} if(action==='toggle-qa') {qaOpen=!qaOpen; render();} if(action==='fullscreen') requestFullscreen(); if(action==='open-project') {selectedProject=el.dataset.project; jump('projectDetail');} if(action==='select-project-media') {selectedProjectMedia[el.dataset.project]=el.dataset.media; render(); document.querySelector(`[data-action="select-project-media"][data-media="${CSS.escape(el.dataset.media)}"]`)?.focus({preventScroll:true});} if(action==='select-project') {selectedProject=el.dataset.project; render();} if(action==='select-month') {selectedMonthIndex=Number(el.dataset.monthIndex); render();} if(action==='select-bigger') {selectedBigger=el.dataset.node; render();} if(action==='select-faster') {selectedFaster=el.dataset.node; render();} if(action==='select-goal') {selectedGoalIndex=Number(el.dataset.goal); render();} if(action==='toggle-source') {sourceOpen=!sourceOpen; render();} if(action==='open-highlight') {highlightPreviewId=el.dataset.highlight; render();} if(action==='close-highlight') {highlightPreviewId=null; render();} if(action==='timeline-detail') showNote(state.timeline[Number(el.dataset.index)].title, `${state.timeline[Number(el.dataset.index)].body}\n\n职责关键词：${state.timeline[Number(el.dataset.index)].tags.join('、')}`); if(action==='project-evidence') {const p=state.projects.find(x=>x.id===selectedProject); showNote('项目证据待补充', p.evidence + '\n\n可将本人确认可使用的图片放入 public/assets/projects/，再通过编辑模式更新项目描述或由 Codex 固化到默认内容。');} if(action==='close-note') closeNote(); if(action==='undo') undo(); if(action==='redo') redo(); if(action==='export') exportJson(); if(action==='apply-json') applyJson(); if(action==='reset') resetData(); if(action==='slide-move') moveSlide(el.dataset.slide,Number(el.dataset.direction));
}
function showNote(title, content) { const modal=document.querySelector('.note-modal'); modal.classList.add('open'); modal.querySelector('#modal-title').textContent=title; modal.querySelector('#modal-content').textContent=content; }
function closeNote(){ document.querySelector('.note-modal')?.classList.remove('open'); }
function moveSlide(id, direction){ update(d=>{const i=d.slides.findIndex(s=>s.id===id); const target=i+direction; if(target>=0&&target<d.slides.length)[d.slides[i],d.slides[target]]=[d.slides[target],d.slides[i]];},'页面排序已保存'); }
function applyJson(){ const text=document.querySelector('#json-editor')?.value; try {const parsed=JSON.parse(text); if(!validateData(parsed)) throw Error('数据结构不完整，或月度金额格式不正确'); history.push(clone(state)); state=migrateAssetRevision(parsed); redoStack=[]; persist(); render(); toast('JSON 校验通过，已应用');}catch(err){toast(`JSON 未应用：${err.message}`);} }
function exportJson(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a');a.href=url;a.download='李昀芷转正答辩-内容数据.json';a.click();URL.revokeObjectURL(url);toast('JSON 已导出'); }
function importJson(event){ const file=event.target.files?.[0]; if(!file)return; const reader=new FileReader(); reader.onload=()=>{ try{const parsed=JSON.parse(reader.result);if(!validateData(parsed))throw Error('数据结构不完整'); history.push(clone(state));state=migrateAssetRevision(parsed);redoStack=[];persist();render();toast('JSON 已导入');}catch(err){toast(`导入失败：${err.message}`);}};reader.readAsText(file); }
function resetData(){ if(!confirm('将清除本浏览器保存的修改并恢复默认内容，是否继续？'))return; history.push(clone(state)); state=clone(DEFAULT_DATA); redoStack=[]; persist(); render(); toast('已恢复默认内容'); }
window.addEventListener('keydown',(e)=>{ const tag=document.activeElement?.tagName; if(['INPUT','TEXTAREA','SELECT'].includes(tag)) return; if((['BUTTON','A'].includes(tag)||document.activeElement?.getAttribute('role')==='button')&&['Enter',' '].includes(e.key))return; if((editorOpen||menuOpen||qaOpen||sourceOpen||highlightPreviewId)&&e.key!=='Escape')return; if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();go(1);} if(e.key==='ArrowLeft'){e.preventDefault();go(-1);} if(e.key.toLowerCase()==='q'){qaOpen=!qaOpen;render();} if(e.key==='Escape'){menuOpen=false;editorOpen=false;qaOpen=false;sourceOpen=false;highlightPreviewId=null;render();} });
window.addEventListener('wheel',(e)=>{ if(editorOpen||menuOpen||qaOpen||sourceOpen||highlightPreviewId) return;const slide=document.querySelector('main.slide');if(slide&&slide.scrollHeight>slide.clientHeight+2)return; if(wheelLocked||Math.abs(e.deltaY)<25)return; wheelLocked=true;go(e.deltaY>0?1:-1);setTimeout(()=>wheelLocked=false,700);},{passive:true});
render();
// 旧版本存档在加载时已自动升级（补全新字段）：回写本地存储，避免下次重复迁移或字段缺失
try { const saved = localStorage.getItem(STORE_KEY); const savedRev = saved ? JSON.parse(saved).meta?.contentRevision : null; if (savedRev !== state.meta.contentRevision) persist(); } catch { /* localStorage 不可用时静默忽略 */ }

</script>
  </body>
